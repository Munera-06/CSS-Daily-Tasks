<html>
<head>
	<title>Credit Card</title>
</head>
	<style>
		h2{
			color:#A61D22;
		}
		.visa{
			border:hidden;
			margin-left:110px;
		}
		.mc{
			border:hidden;
			margin-right:12px;
		}
		.ae{
			border:hidden;
			margin-left:12px;
		}
		
		.column{
			border : 2px solid;
			margin-left:70px ;
		}
		.colum{
			border : 2px solid;
			margin:0px 2px ;
		}
		.colu{
			border : 2px solid;
			margin:0px 0px ;
		}
		.col{
			border : 2px solid;
			margin:0px 0px ;
		}
		.co{
			border : 2px solid;
			margin-left:11px ;
		}
		.c{
			border : 2px solid;
			margin:0px 1px ;
		}
		.clmn{
			border : 2px solid;
			margin:0px 0px ;
		}
		.clm{
			border : 2px solid;
			margin:0px 0px ;
		}
		.mail{
			border : 2px solid;
			margin-left:175px;
		}
		.phno{
			border : 2px solid;
			margin-left:135px;
		}
		.rs{
			border : 2px solid;
			margin-left:95px;
		}
		select{
			border : 2px solid;
			margin-left:95px;
		}
		.sub{
			border:2px solid black;
			margin-left:150px;
			padding:3px;
			width:85;
		}
		
	</style>
<body>
<form>
	<h2>IndusInd Bank Credit Card details</h2><br>
	<label> Please enter your IndusInd bank Credit Card Number and payment amount</label>
	<hr>	
	<br>
	<label>Select Card Type :</label>
	<input class="visa" type ="radio" id="img" name="img"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQPDres70FZbF62_KYohhWmmOCJw2FZDIhnonMxphmNcw&s" height= 40 width=50
	alt="VISA">
	<input class="mc"type ="radio" id="img" name="img"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSe_2r4gTrkG2kPfCf0xVine-IfYBuUik91yRLHK56YgQ&s" height= 40 width=50
	alt="Master card">
	<input class="ae" type ="radio" id="img" name="img"><img src="https://1000logos.net/wp-content/uploads/2016/10/American-Express-Color.png" height= 40 width=75
	alt="American Express"><br><br>
	<label>IndusInd Credit Card no:</label>
	<input class="column"type="text"id="no" name="no" size =4>
	<input class="colum" type="text"id="no" name="no" size =4>
	<input class="colu" type="text"id="no" name="no" size =4>
	<input class="col" type="text"id="no" name="no" size =4><br><br>
	<label>Re-enter IndusInd Credit Card no:</label>
	<input class="co"type="text"id="no" name="no" size =4>
	<input class="c" type="text"id="no" name="no" size =4>
	<input class="clmn" type="text"id="no" name="no" size =4>
	<input class="clm" type="text"id="no" name="no" size =4><br><br>
	<label>Email Id</label>
	<input class="mail" type="email" id="email" name="email" required><br><br>
	<label>Phone Number</label>
	<input class="phno" type="number"><br><br>
	<label>Payment amount(Rs)</label>
	<input class="rs" type="text"id="rs" name="rs">
	<h3>Choose your Bank Account below and Click on Submit</h3>
	<hr>
	<label>Select Bank Account</label>
	<select>
		<option>--select your account--</option>
		<option>State Bank of India</option>
		<option>Union Bank of India</option>
		<option>Reserve Bank of India</option>
		<option>Canara Bank</option>
	</select><br><br>
	<input class="sub"type="submit">
</body>
</html>
