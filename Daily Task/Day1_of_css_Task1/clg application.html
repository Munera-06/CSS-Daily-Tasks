<html>
<head>
	<title>college application form</title>
</head>
	<style>
		h4{
			color:red;
		}
		h2{
			color:#F52773;	
			margin:30px;
			padding:20px;
			
		}
		.fn{
			border:1px solid black;
			margin:0 50px;
			padding:5px;
		}
		.ln{
			border:1px solid black;
			margin:0 60px;
			padding:5px;
		}
		.dob{
			border:1px solid black;
			margin:0 45px;
			padding:5px;
		}
		.phno{
			border:1px solid black;
			margin:0 25px;
			padding:5px;
		}
		.mail{
			border:1px solid black;
			margin:0 65px;
			padding:5px;
		}
		select{
			border:1px solid black;
			margin:0 43px;
			padding:5px;
		}
		.tym{
			border:1px solid black;
			margin:0 95px;
			padding:5px;
		}
		.sub{
			border:1px solid black;
			margin:0 25px;
			padding:5px;
			width:85;
		}
		.reg{
			border:1px solid black;
			margin:0 25px;
			padding:5px;
			width:85;
		}				
		form{
			background-color:#FCBBD3;
			border: 4px double black;
			padding:20px;
		.rd{
			border:hidden;
			margin-left:130px;
		}
	</style>
<body>
	<form>
		<h2><center>COLLEGE APPLICATION FORM 2026</center></h2>
		<h4>*indicates mandatory</h4>
		<label>First Name*</label>
		<input class="fn" type="text" id="fullname" name="fullname"><br><br>
		<label>Last Name</label>
		<input class="ln" type="text" id="fullname" name="fullname"><br><br>
		<label> Select Your Gender</label><br><br>
		<input class="rd" type="radio" id="male" name="gender">Male<br>
		<input class="rd" type="radio" id="female" name="gender">Female</class><br><br>
		<label>Date of Birth</label>
		<input class="dob" type="date"><br><br>
		<label> Phone Number*</label>
		<input class="phno" type="number" id="phone" name ="phone" placeholder= "Enter Your 10 digit Number" required><br><br>
		<label> Email id*</label>
		<input class="mail" type="email" id="email" name ="email" placeholder= "Enter Your Email id" required><br><br>
		<label> Department*</label>
		<select>
			<option>        </option>
			<option> Physics</option>
			<option> Chemistry</option>
			<option> Computer Science</option>
			<option> Tamil</option>
			<option> Commerce</option>
		</select><br><br>
		<label>Time</label>
		<input class="tym" type="time"><br><br><br>
		<input class="sub" type="Submit" value="Register">
		<input class="reg" type="Reset"><br><br><br>
	</form>
</body>
</html>
